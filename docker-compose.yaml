# Dify — biến thể compose Ở GỐC REPO dành cho nền tảng triển khai VAYS Portable.
#
# VÌ SAO TỒN TẠI: bản quét cụm của nền tảng chỉ tìm tệp compose ở GỐC repo
# (router_server_vibe_scan.go:203 — `appFileExists(s, "", "docker-compose.yaml")`). Tệp thật của
# Dify nằm ở `docker/docker-compose.yaml` nên nền tảng không thấy gì và không nhận diện được cụm.
#
# ĐÂY LÀ BẢN RÚT GỌN ĐỂ ĐO, KHÔNG PHẢI BẢN CHẠY THẬT. Nó giữ đúng ảnh và tô-pô của 9 thành phần
# lõi mà Dify cần để hoạt động tối thiểu, bỏ 24 dịch vụ theo profile (các kho vector thay thế nhau)
# và bỏ các thành phần phụ (certbot, api_websocket, worker_beat, agent_backend, local_sandbox).
# Cấu hình đầy đủ vẫn xem `docker/docker-compose.yaml`.
#
# Mục đích: để bản quét của VAYS phân loại từng thành phần — cái nào nền tảng dựng/cấp được, cái nào
# rơi vào nhóm "không dựng và cũng không cấp được" (STACK_UNSUPPORTED_SERVICES).

services:
  # ── Tầng dữ liệu: nền tảng có thể cấp dạng CSDL quản lý ──
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: difyai123456
      POSTGRES_DB: dify

  redis:
    image: redis:6-alpine
    command: redis-server --requirepass difyai123456

  # ── Tầng ứng dụng ──
  api:
    image: langgenius/dify-api:1.16.1
    expose:
      - "5001"
    depends_on:
      - db
      - redis

  worker:
    image: langgenius/dify-api:1.16.1
    environment:
      MODE: worker
    depends_on:
      - db
      - redis

  web:
    image: langgenius/dify-web:1.16.1
    expose:
      - "3000"

  # ── Thành phần đặc thù: chạy mã người dùng, proxy chặn SSRF, plugin ──
  sandbox:
    image: langgenius/dify-sandbox:0.2.15
    expose:
      - "8194"

  plugin_daemon:
    image: langgenius/dify-plugin-daemon:0.6.10-local
    expose:
      - "5002"
    depends_on:
      - db

  ssrf_proxy:
    image: ubuntu/squid:latest
    expose:
      - "3128"

  # ── Cửa vào HTTP duy nhất ──
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    depends_on:
      - api
      - web
